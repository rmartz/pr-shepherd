# npm grouping, in precedence order:
#   1. Version-locked families (react, storybook, vite, tailwind) — sets of
#      interdependent packages that ship on a shared version line, so a bump to
#      one always moves the rest in the same PR (react across all update types;
#      the dev-only families for majors). A react major without react-dom, or
#      one @storybook/* without the others, is an inherently broken update.
#   2. CI-sensitive tools (`ci`: eslint and prettier, with their plugins and
#      configs) — pr-policy requires a `ci` title for any eslint/prettier
#      version change, so every bump (major, minor, and patch) is split into its
#      own PR instead of blocking a catch-all batch.
#   3. TypeScript (the compiler) — a bump can surface new type errors, so every
#      typescript bump is split into its own PR for visibility.
#   4. dev / production catch-alls — minor+patch only, so a major that matches
#      no earlier group is raised as an individual PR, isolating the changes
#      most likely to require code updates for separate review.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # No explicit `cooldown` on npm — deliberately omitted, do not add one. (Since
    # 2026-07-14 Dependabot applies a 3-day default cooldown even with no block
    # declared; the github-actions entry below declares one only to exempt
    # first-party `rmartz/*` actions and reusable workflows, which are published
    # from our own repos with provenance, while third-party actions keep the
    # default wait.) Dependabot passes a `cooldown` to pnpm as
    # `minimumReleaseAge` during lockfile regeneration. When any transitive dep in
    # a fast-moving toolchain has a version published inside the window, pnpm
    # hard-fails (ERR_PNPM_NO_MATURE_MATCHING_VERSION) rather than falling back to
    # an older mature version, so the whole grouped update fails and the PR
    # auto-closes as "no longer updatable". A freshness policy cannot coexist with
    # Dependabot always resolving to latest: Dependabot keeps its PRs current, so
    # even a bump pinned to an older release still pulls in transitive deps that
    # are too new — the exact threat a cooldown was meant to avoid. It adds
    # friction without meeting the goal. See #374 (and rmartz/hidden-role-game#852).
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # Version-locked families — sets of interdependent packages that ship on a
      # shared version line, so a bump to one not matched by the rest breaks the
      # build. Listed first to win group-assignment precedence (a dependency
      # joins the first group it fully matches).
      #
      # `react` spans prod (react, react-dom) and dev (@types/*), so the dev/prod
      # catch-alls would scatter its members — it must group across ALL update
      # types. The other families live entirely in `dev-dependencies`, whose batch
      # already moves their minor/patch bumps in lockstep; only a MAJOR (which the
      # catch-all excludes) would otherwise scatter into standalone per-package
      # PRs. So those families are scoped to `update-types: [major]` — the one
      # case they actually need to fix — avoiding an extra PR per minor/patch.
      react:
        # react + react-dom ship the same version and must move together; the
        # @types track react's major. Crosses prod/dev, so: all update types.
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      storybook:
        # Every @storybook/* package, the storybook CLI, and the eslint plugin
        # share one Storybook version line. All dev, so group majors only; minor/
        # patch ride the dev batch. Listed before `vite` so @storybook/nextjs-vite
        # lands here, not in vite.
        patterns:
          - "storybook"
          - "@storybook/*"
          - "eslint-plugin-storybook"
        update-types:
          - "major"
      vite:
        # vite + its react plugin + vitest + @vitest/* are one interlocked
        # toolchain (the @vitejs/plugin-react 6 -> vite 8 coupling). All dev, so
        # group majors only.
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vitest"
          - "@vitest/*"
        update-types:
          - "major"
      ci:
        # CI-sensitive tools in one group: pr-policy requires a `ci` title for
        # any eslint/prettier version change (the formatter/linter can fail files
        # a PR never touched), so they must not ride in a catch-all where they
        # would block every routine bump. Plugins and configs move in lockstep
        # with their tool: eslint + @eslint/js share a version line;
        # typescript-eslint and the eslint plugins/import resolver track the
        # eslint major; prettier plugins (e.g. prettier-plugin-tailwindcss) track
        # prettier. Unlike the dev-only families above, no update-types filter,
        # so a major brings its family with it and a minor/patch never falls
        # through to the dev catch-all. eslint-plugin-storybook is excluded: a
        # major matches the `storybook` group above first, and a minor/patch
        # falls through to the dev catch-all alongside storybook and @storybook/*.
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "typescript-eslint"
          - "prettier"
          - "prettier-plugin-*"
        exclude-patterns:
          - "eslint-plugin-storybook"
      tailwind:
        # tailwindcss core + its postcss plugin ship in lockstep. All dev, so
        # group majors only. (prettier-plugin-tailwindcss matches `ci` above.)
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
        update-types:
          - "major"
      # TypeScript is the language/compiler itself — a bump is a more significant
      # change than a normal dependency (it can surface new type errors), so every
      # typescript bump (no update-types filter) lands in its own PR for
      # visibility. Exact `typescript` — must NOT catch `typescript-eslint`,
      # which belongs to the `ci` group.
      typescript:
        patterns:
          - "typescript"
      dev-dependencies:
        dependency-type: development
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
      production-dependencies:
        dependency-type: production
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      # Explicit, so declaring the block can't change the third-party default.
      default-days: 3
      exclude:
        - "rmartz/*"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Minor and patch action bumps batch into one PR; every major opens as its
    # own PR (like the npm catch-alls above), so a pending major never holds
    # routine bumps back from merging.
    groups:
      # rmartz/storybook-ci ships its two reusable workflows on one version
      # line, so they always bump together. Dependabot names a reusable
      # workflow by its full path and opens one PR per file once a major
      # leaves the catch-all below; this group, listed first to win precedence
      # and with no update-types filter, keeps every bump (majors included) in
      # one PR titled by the group name.
      storybook-ci:
        patterns:
          - "rmartz/storybook-ci/*"
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
