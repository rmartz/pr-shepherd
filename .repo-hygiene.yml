# @rmartz/repo-hygiene check configuration, read by the repo-hygiene-action caller
# in .github/workflows/repo-hygiene.yml. See the rmartz/repo-hygiene repo for each
# check's docs. Each section under `checks` is read by the check of that name.
checks:
  # OKF docs frontmatter: the pr-shepherd `type` vocabulary (see docs/index.md).
  okf:
    types: [Adapter, Design, Log, Reference, StepExecutor, Subsystem, Workflow]
    roots: [docs]
    resourceExemptTypes: '*' # a `resource` is recommended, not required
  # One root docs/index.md links every page directly, so subdirectories carry no
  # index of their own.
  okf-index:
    roots: [docs]
    nestedIndexes: false
